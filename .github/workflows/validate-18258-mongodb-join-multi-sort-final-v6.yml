name: Validate issue 18258 MongoDB join multi-sort candidate v6

on:
  push:
    branches:
      - validate/18258-mongodb-join-multi-sort-final-v6

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'dijedontahiri/payload'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BASE_SHA: a81514022705fd327342fc25fc4f0731b418f12a
      CANDIDATE_SHA: 0be9b702e1d2baee8832accdcbfc730ddbaa9870
      PAYLOAD_DATABASE: mongodb
      MONGODB_URL: mongodb://payload:payload@localhost:27018/payload?authSource=admin&directConnection=true&replicaSet=rs0
      NODE_OPTIONS: --no-deprecation --no-experimental-strip-types --max-old-space-size=6144
      DO_NOT_TRACK: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          repository: dijedontahiri/payload
          ref: 0be9b702e1d2baee8832accdcbfc730ddbaa9870
          fetch-depth: 0

      - name: Verify candidate identity and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA"..HEAD | sort | tr '\n' ' ')" = "packages/db-mongodb/src/utilities/buildJoinAggregation.ts test/joins/multiSort.int.spec.ts "
          git diff --check "$BASE_SHA"..HEAD
          test "$(git hash-object packages/db-mongodb/src/utilities/buildJoinAggregation.ts)" = "71c3bdac892beae8eec4ab167e64644e73e1d2e2"
          test "$(git hash-object test/joins/multiSort.int.spec.ts)" = "0b49529ea587aaba0daf67d35ac73eb62a2094f0"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0

      - name: Set up pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          test "$(node --version)" = "v24.13.0"
          test "$(pnpm --version)" = "11.9.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 15

      - name: Start MongoDB replica set
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            docker compose -f test/docker-compose.yml --profile mongodb pull && break
            sleep 10
          done
          docker compose -f test/docker-compose.yml --profile mongodb up -d --wait

      - name: Run focused MongoDB regression
        run: pnpm exec vitest run --project int test/joins/multiSort.int.spec.ts --retry=0

      - name: Run existing join integration coverage
        run: pnpm exec vitest run --project int test/joins/int.spec.ts --retry=0
        timeout-minutes: 10

      - name: Check formatting
        run: pnpm exec prettier --check packages/db-mongodb/src/utilities/buildJoinAggregation.ts test/joins/multiSort.int.spec.ts

      - name: Lint changed files
        run: pnpm exec eslint packages/db-mongodb/src/utilities/buildJoinAggregation.ts test/joins/multiSort.int.spec.ts

      - name: Build MongoDB adapter with workspace dependencies
        run: pnpm turbo build --filter @payloadcms/db-mongodb...
        timeout-minutes: 15

      - name: Verify tested source stayed exact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git hash-object packages/db-mongodb/src/utilities/buildJoinAggregation.ts)" = "71c3bdac892beae8eec4ab167e64644e73e1d2e2"
          test "$(git hash-object test/joins/multiSort.int.spec.ts)" = "0b49529ea587aaba0daf67d35ac73eb62a2094f0"
          git diff --check "$BASE_SHA"..HEAD
