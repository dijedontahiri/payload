name: Validate issue 18284 GCS alwaysInsertFields baseline

on:
  push:
    branches:
      - validate/18284-gcs-always-insert-fields-baseline

permissions:
  contents: read

jobs:
  negative-control:
    if: github.repository == 'dijedontahiri/payload'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_SHA: d4c81bb92784a5e806e14a51331c41a9accdc3c7
      TEST_SHA: ca1d5cc4c8f7b764fd9012ca3a0ce5f7ade81576
      NODE_OPTIONS: --no-deprecation --no-experimental-strip-types --max-old-space-size=4096
      DO_NOT_TRACK: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout exact baseline plus regression
        uses: actions/checkout@v5
        with:
          repository: dijedontahiri/payload
          ref: ca1d5cc4c8f7b764fd9012ca3a0ce5f7ade81576
          fetch-depth: 0

      - name: Verify source identity and test-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TEST_SHA"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA"..HEAD | sort | tr '\n' ' ')" = "packages/storage-gcs/src/index.spec.ts "
          git diff --check "$BASE_SHA"..HEAD

      - name: Set up Node and pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          test "$(node --version)" = "v24.13.0"
          test "$(pnpm --version)" = "11.9.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 15

      - name: Confirm the regression fails for the intended assertion
        shell: bash
        run: |
          set -euo pipefail
          set +e
          pnpm exec vitest run --project unit packages/storage-gcs/src/index.spec.ts --retry=0 2>&1 | tee /tmp/negative-control.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F "should insert storage fields when disabled and alwaysInsertFields is true" /tmp/negative-control.log
          grep -F "AssertionError" /tmp/negative-control.log
          grep -F "prefix" /tmp/negative-control.log

      - name: Verify tested source stayed exact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TEST_SHA"
          git diff --check "$BASE_SHA"..HEAD
