name: Validate issue 18251 relationship id dedupe final

on:
  push:
    branches:
      - validate/18251-dedupe-relationship-ids-final

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'dijedontahiri/payload'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact product candidate
        uses: actions/checkout@v4
        with:
          repository: dijedontahiri/payload
          ref: 2485d00268d12e0db16d4ba8a00d540d0d0154e4
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 15

      - name: Run focused regression
        run: pnpm exec vitest run --project unit packages/drizzle/src/queries/sanitizeQueryValue.spec.ts

      - name: Check formatting
        run: pnpm exec prettier --check packages/drizzle/src/queries/sanitizeQueryValue.ts packages/drizzle/src/queries/sanitizeQueryValue.spec.ts

      - name: Lint changed files
        run: pnpm exec eslint packages/drizzle/src/queries/sanitizeQueryValue.ts packages/drizzle/src/queries/sanitizeQueryValue.spec.ts

      - name: Build Drizzle package and workspace dependencies
        run: pnpm turbo build --filter=@payloadcms/drizzle
        timeout-minutes: 15

      - name: Verify exact product diff and clean source
        run: |
          test "$(git rev-parse HEAD)" = "2485d00268d12e0db16d4ba8a00d540d0d0154e4"
          git diff --check 972a4fb0ed7556bba9b49ea02e0d6ebe2127993b..HEAD
          test "$(git diff --name-only 972a4fb0ed7556bba9b49ea02e0d6ebe2127993b..HEAD | wc -l)" -eq 2
          git diff --name-only 972a4fb0ed7556bba9b49ea02e0d6ebe2127993b..HEAD | grep -Fx "packages/drizzle/src/queries/sanitizeQueryValue.ts"
          git diff --name-only 972a4fb0ed7556bba9b49ea02e0d6ebe2127993b..HEAD | grep -Fx "packages/drizzle/src/queries/sanitizeQueryValue.spec.ts"
          test -z "$(git status --porcelain)"
