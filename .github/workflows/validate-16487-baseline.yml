name: Validate issue 16487 filePath image sizes baseline

on:
  push:
    branches:
      - validation/16487-baseline

permissions:
  contents: read

jobs:
  baseline:
    if: github.repository == 'dijedontahiri/payload'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact reproduction candidate
        uses: actions/checkout@v6
        with:
          repository: dijedontahiri/payload
          ref: 514083a469f60fef6f0934b4ae545e3094e069da
          fetch-depth: 2
          persist-credentials: false

      - name: Verify immutable source identity
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "514083a469f60fef6f0934b4ae545e3094e069da"
          test "$(git rev-parse HEAD^)" = "6254c3bf561a205223849a6497d7dae824d4e81b"
          test "$(git diff --name-only 6254c3bf561a205223849a6497d7dae824d4e81b..HEAD)" = "test/uploads/file-path-image-sizes.int.spec.ts"
          git diff --check 6254c3bf561a205223849a6497d7dae824d4e81b..HEAD

      - name: Setup repository toolchain
        uses: ./.github/actions/setup

      - name: Prove filePath upload with imageSizes still fails on unchanged production code
        shell: bash
        env:
          PAYLOAD_DATABASE: sqlite
        run: |
          set +e
          pnpm exec vitest --run --project int test/uploads/file-path-image-sizes.int.spec.ts 2>&1 | tee "$RUNNER_TEMP/16487-baseline.log"
          test_status=${PIPESTATUS[0]}
          set -e

          if [ "$test_status" -eq 0 ]; then
            echo "The focused regression passed on unchanged production code; issue #16487 no longer reproduces."
            exit 2
          fi

          grep -F "should create an upload from filePath when image sizes are configured" "$RUNNER_TEMP/16487-baseline.log"
          grep -F "MissingFile" "$RUNNER_TEMP/16487-baseline.log"

      - name: Confirm only the isolated regression differs from upstream
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "514083a469f60fef6f0934b4ae545e3094e069da"
          test "$(git diff --name-only 6254c3bf561a205223849a6497d7dae824d4e81b..HEAD | wc -l)" -eq 1
          test -z "$(git status --porcelain)"
