name: Validate issue 18284 GCS alwaysInsertFields candidate

on:
  push:
    branches:
      - validate/18284-gcs-always-insert-fields-final

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'dijedontahiri/payload'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BASE_SHA: d4c81bb92784a5e806e14a51331c41a9accdc3c7
      CANDIDATE_SHA: c5e67c765b0fb4d0be8582c12f252970303401bc
      NODE_OPTIONS: --no-deprecation --no-experimental-strip-types --max-old-space-size=4096
      DO_NOT_TRACK: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          repository: dijedontahiri/payload
          ref: c5e67c765b0fb4d0be8582c12f252970303401bc
          fetch-depth: 0

      - name: Verify candidate identity and scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA"..HEAD | sort | tr '\n' ' ')" = "packages/storage-gcs/src/index.spec.ts packages/storage-gcs/src/index.ts "
          git diff --check "$BASE_SHA"..HEAD
          test "$(git hash-object packages/storage-gcs/src/index.ts)" = "45d04120fa23451dbbe8c1b0849ef4f9505bdb6f"
          test "$(git hash-object packages/storage-gcs/src/index.spec.ts)" = "4d29812209f785191d719e3653b290e76569930d"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0

      - name: Set up pnpm
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          test "$(node --version)" = "v24.13.0"
          test "$(pnpm --version)" = "11.9.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 15

      - name: Run focused regression
        run: pnpm exec vitest run --project unit packages/storage-gcs/src/index.spec.ts --retry=0

      - name: Run storage GCS unit coverage
        run: pnpm exec vitest run --project unit packages/storage-gcs/src --retry=0

      - name: Check formatting
        run: pnpm exec prettier --check packages/storage-gcs/src/index.ts packages/storage-gcs/src/index.spec.ts

      - name: Lint changed files
        run: pnpm exec eslint packages/storage-gcs/src/index.ts packages/storage-gcs/src/index.spec.ts

      - name: Build storage GCS with workspace dependencies
        run: pnpm run build:storage-gcs
        timeout-minutes: 15

      - name: Verify tested source stayed exact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git hash-object packages/storage-gcs/src/index.ts)" = "45d04120fa23451dbbe8c1b0849ef4f9505bdb6f"
          test "$(git hash-object packages/storage-gcs/src/index.spec.ts)" = "4d29812209f785191d719e3653b290e76569930d"
          git diff --check "$BASE_SHA"..HEAD
