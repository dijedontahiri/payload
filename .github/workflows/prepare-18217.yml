name: Validate 18217 localized traversal fix

on:
  push:
    branches:
      - prepare/18217-traverse-localized-groups-20260919

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'dijedontahiri/payload'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact upstream source
        uses: actions/checkout@v4
        with:
          repository: payloadcms/payload
          ref: d58f8fba427dda48101ba274ef6f3889690fb244
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 15

      - name: Add regression tests
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/payload/src/utilities/traverseFields.spec.ts')
          text = path.read_text()
          marker = '\n})\n'
          index = text.rfind(marker)
          if index == -1:
              raise SystemExit('Could not locate describe terminator')

          tests = r'''

  describe('locale-resolved localized data', () => {
    it('should traverse a localized group in locale-resolved shape', () => {
      let didVisitNotice = false

      traverseFields({
        callback: ({ field }) => {
          if (field.type === 'text' && field.name === 'notice') {
            didVisitNotice = true
          }
        },
        fields: [
          {
            name: 'legal',
            type: 'group',
            localized: true,
            fields: [
              {
                name: 'notice',
                type: 'text',
              },
            ],
          },
        ],
        fillEmpty: false,
        ref: {
          legal: {
            notice: 'Terms',
          },
        },
      })

      expect(didVisitNotice).toBe(true)
    })

    it('should traverse a localized named tab in locale-resolved shape', () => {
      let didVisitNotice = false

      traverseFields({
        callback: ({ field }) => {
          if (field.type === 'text' && field.name === 'notice') {
            didVisitNotice = true
          }
        },
        fields: [
          {
            type: 'tabs',
            tabs: [
              {
                name: 'legal',
                localized: true,
                fields: [
                  {
                    name: 'notice',
                    type: 'text',
                  },
                ],
              },
            ],
          },
        ],
        fillEmpty: false,
        ref: {
          legal: {
            notice: 'Terms',
          },
        },
      })

      expect(didVisitNotice).toBe(true)
    })
  })
'''
          path.write_text(text[:index] + tests + text[index:])
          PY

      - name: Verify baseline regressions fail for intended assertions
        shell: bash
        run: |
          set +e
          pnpm exec vitest run --project unit packages/payload/src/utilities/traverseFields.spec.ts -t 'locale-resolved localized data' 2>&1 | tee /tmp/baseline.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'Baseline unexpectedly passed'
            exit 1
          fi
          grep -q 'should traverse a localized group in locale-resolved shape' /tmp/baseline.log
          grep -q 'should traverse a localized named tab in locale-resolved shape' /tmp/baseline.log
          grep -q 'AssertionError' /tmp/baseline.log

      - name: Apply focused fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/payload/src/utilities/traverseFields.ts')
          text = path.read_text()

          import_marker = "import { expandOwnDottedKey } from './fieldPath.js'\n\n"
          helper = r'''import { expandOwnDottedKey } from './fieldPath.js'

const refContainsFieldData = ({
  fields,
  ref,
}: {
  fields: (Field | TabAsField)[]
  ref: Record<string, unknown>
}): boolean =>
  fields.some((field) => {
    if (fieldAffectsData(field) && 'name' in field && typeof field.name === 'string') {
      return field.name in ref
    }

    if (field.type === 'tabs') {
      return field.tabs.some((tab) =>
        tabHasName(tab)
          ? tab.name in ref
          : refContainsFieldData({ fields: tab.fields, ref }),
      )
    }

    if (fieldHasSubFields(field)) {
      return refContainsFieldData({ fields: field.fields, ref })
    }

    return false
  })

'''
          if text.count(import_marker) != 1:
              raise SystemExit('Unexpected import marker count')
          text = text.replace(import_marker, helper, 1)

          old_tab = r'''          if (tabIsLocalized) {
            for (const key in tabRef as Record<string, unknown>) {
              if (
                tabRef[key as keyof typeof tabRef] &&
                typeof tabRef[key as keyof typeof tabRef] === 'object'
              ) {
                traverseFields({
                  callback,
                  callbackStack,
                  config,
                  fields: tab.fields,
                  fillEmpty,
                  isTopLevel: false,
                  leavesFirst,
                  parentIsLocalized: true,
                  parentPath: `${parentPath}${tab.name}.`,
                  parentRef: currentParentRef,
                  ref: tabRef[key as keyof typeof tabRef],
                })
              }
            }
          }
'''
          new_tab = r'''          if (tabIsLocalized) {
            if (
              tabRef &&
              typeof tabRef === 'object' &&
              refContainsFieldData({ fields: tab.fields, ref: tabRef as Record<string, unknown> })
            ) {
              traverseFields({
                callback,
                callbackStack,
                config,
                fields: tab.fields,
                fillEmpty,
                isTopLevel: false,
                leavesFirst,
                parentIsLocalized: true,
                parentPath: `${parentPath}${tab.name}.`,
                parentRef: currentParentRef,
                ref: tabRef,
              })
            } else {
              for (const key in tabRef as Record<string, unknown>) {
                if (
                  tabRef[key as keyof typeof tabRef] &&
                  typeof tabRef[key as keyof typeof tabRef] === 'object'
                ) {
                  traverseFields({
                    callback,
                    callbackStack,
                    config,
                    fields: tab.fields,
                    fillEmpty,
                    isTopLevel: false,
                    leavesFirst,
                    parentIsLocalized: true,
                    parentPath: `${parentPath}${tab.name}.`,
                    parentRef: currentParentRef,
                    ref: tabRef[key as keyof typeof tabRef],
                  })
                }
              }
            }
          }
'''
          if text.count(old_tab) != 1:
              raise SystemExit('Unexpected localized tab block count')
          text = text.replace(old_tab, new_tab, 1)

          old_group = r'''        if (fieldAffectsData(field)) {
          for (const key in currentRef as Record<string, unknown>) {
            if (currentRef[key as keyof typeof currentRef]) {
              traverseFields({
                callback,
                callbackStack,
                config,
                fields: field.fields,
                fillEmpty,
                isTopLevel: false,
                leavesFirst,
                parentIsLocalized: true,
                parentPath: field.name ? `${parentPath}${field.name}.` : parentPath,
                parentRef: currentParentRef,
                ref: currentRef[key as keyof typeof currentRef],
              })
            }
          }
        } else {
'''
          new_group = r'''        if (fieldAffectsData(field)) {
          if (
            refContainsFieldData({
              fields: field.fields,
              ref: currentRef as Record<string, unknown>,
            })
          ) {
            traverseFields({
              callback,
              callbackStack,
              config,
              fields: field.fields,
              fillEmpty,
              isTopLevel: false,
              leavesFirst,
              parentIsLocalized: true,
              parentPath: field.name ? `${parentPath}${field.name}.` : parentPath,
              parentRef: currentParentRef,
              ref: currentRef,
            })
          } else {
            for (const key in currentRef as Record<string, unknown>) {
              if (currentRef[key as keyof typeof currentRef]) {
                traverseFields({
                  callback,
                  callbackStack,
                  config,
                  fields: field.fields,
                  fillEmpty,
                  isTopLevel: false,
                  leavesFirst,
                  parentIsLocalized: true,
                  parentPath: field.name ? `${parentPath}${field.name}.` : parentPath,
                  parentRef: currentParentRef,
                  ref: currentRef[key as keyof typeof currentRef],
                })
              }
            }
          }
        } else {
'''
          if text.count(old_group) != 1:
              raise SystemExit('Unexpected localized group block count')
          text = text.replace(old_group, new_group, 1)
          path.write_text(text)
          PY

      - name: Run focused unit regression suite
        run: pnpm exec vitest run --project unit packages/payload/src/utilities/traverseFields.spec.ts

      - name: Format changed files
        run: |
          pnpm exec prettier --write packages/payload/src/utilities/traverseFields.ts packages/payload/src/utilities/traverseFields.spec.ts
          pnpm exec prettier --check packages/payload/src/utilities/traverseFields.ts packages/payload/src/utilities/traverseFields.spec.ts

      - name: Re-run regression after formatting
        run: pnpm exec vitest run --project unit packages/payload/src/utilities/traverseFields.spec.ts

      - name: Lint changed files
        run: pnpm exec eslint packages/payload/src/utilities/traverseFields.ts packages/payload/src/utilities/traverseFields.spec.ts

      - name: Type build payload package
        run: pnpm --filter payload build:types
        timeout-minutes: 10

      - name: Review exact candidate diff
        run: |
          git diff --check
          git status --short
          git diff -- packages/payload/src/utilities/traverseFields.ts packages/payload/src/utilities/traverseFields.spec.ts
          test "$(git status --short | wc -l)" -eq 2

      - name: Stage candidate files for artifact
        run: |
          mkdir -p /tmp/candidate/packages/payload/src/utilities
          cp packages/payload/src/utilities/traverseFields.ts /tmp/candidate/packages/payload/src/utilities/
          cp packages/payload/src/utilities/traverseFields.spec.ts /tmp/candidate/packages/payload/src/utilities/
          git diff > /tmp/candidate/18217.patch
          printf '%s\n' 'd58f8fba427dda48101ba274ef6f3889690fb244' > /tmp/candidate/base-sha.txt

      - name: Upload exact verified candidate
        uses: actions/upload-artifact@v4
        with:
          name: candidate-18217
          path: /tmp/candidate
          if-no-files-found: error
          retention-days: 1
