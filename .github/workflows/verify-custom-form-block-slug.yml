name: Verify custom form block slugs
on:
  push:
    branches: [validate/custom-form-block-slug-20260918]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'dijedontahiri/payload'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PAYLOAD_DATABASE: mongodb
      DATABASE_URI: mongodb://127.0.0.1:27017/payload-form-slug-test
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 17cb596415e92ccddb8126e75d753f02474e3cb5
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.16.0'
      - name: Install pinned dependencies
        id: install
        run: |
          npm install --global pnpm@11.9.0
          pnpm install --frozen-lockfile
      - name: Reproduce missing slugs on original source
        run: |
          source=packages/plugin-form-builder/src/collections/Forms/index.ts
          trap 'git restore -- "$source"' EXIT
          git show 9a2cdcb87aacae41b66ab558a056d974c8f38f4e:"$source" > "$source"
          set +e
          pnpm exec vitest run --config=vitest.config.ts packages/plugin-form-builder/src/collections/Forms/index.spec.ts --reporter=default --reporter=json --outputFile=/tmp/form-before.json
          status=$?
          set -e
          test "$status" -ne 0
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync('/tmp/form-before.json', 'utf8'));
          assert.equal(result.numTotalTests, 5);
          assert.equal(result.numFailedTests, 3);
          assert.equal(result.numPassedTests, 2);
          assert.equal(result.numRuntimeErrorTestSuites || 0, 0);
          console.log('Original source: three slug regressions fail; both compatibility controls pass.');
          JS
      - name: Form builder unit suite on corrected source
        if: always() && steps.install.outcome == 'success'
        run: pnpm exec vitest run --config=vitest.config.ts packages/plugin-form-builder
      - name: Package type check
        if: always() && steps.install.outcome == 'success'
        run: pnpm --filter @payloadcms/plugin-form-builder lint:types
      - name: Package lint
        if: always() && steps.install.outcome == 'success'
        run: pnpm --filter @payloadcms/plugin-form-builder lint
      - name: Package build with workspace prerequisites
        if: always() && steps.install.outcome == 'success'
        run: pnpm exec turbo run build --filter=@payloadcms/plugin-form-builder
      - name: Format and clean-head audit
        if: always() && steps.install.outcome == 'success'
        run: |
          if ! pnpm exec prettier --check packages/plugin-form-builder/src/collections/Forms/index.ts packages/plugin-form-builder/src/collections/Forms/index.spec.ts; then
            pnpm exec prettier --write packages/plugin-form-builder/src/collections/Forms/index.ts packages/plugin-form-builder/src/collections/Forms/index.spec.ts
            git diff
            exit 1
          fi
          git diff --check
          git diff --exit-code
          test "$(git rev-parse HEAD)" = 17cb596415e92ccddb8126e75d753f02474e3cb5
