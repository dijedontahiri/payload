name: Validate 18246 final v5

on:
  push:
    branches:
      - validation/18246-final-v5

permissions:
  contents: read

jobs:
  tests:
    if: github.repository == 'dijedontahiri/payload'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout immutable product candidate
        uses: actions/checkout@v6
        with:
          ref: 536a00d73fb5f87b6c0d879b4b313c863bf9e221
          fetch-depth: 4
          persist-credentials: false

      - name: Verify source identity and scope
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "536a00d73fb5f87b6c0d879b4b313c863bf9e221"
          test "$(git rev-parse HEAD^^^)" = "f5d261d0925e95dbd0039803829dad6e736edcb1"
          git diff --exit-code
          mapfile -t files < <(git diff --name-only f5d261d0925e95dbd0039803829dad6e736edcb1..HEAD)
          printf '%s\n' "${files[@]}"
          test "${#files[@]}" -eq 2
          test "${files[0]}" = "packages/payload/src/utilities/createLocalReq.ts"
          test "${files[1]}" = "test/localization/local-api-request.int.spec.ts"

      - name: Setup repository toolchain
        uses: ./.github/actions/setup

      - name: Confirm setup left tracked tree clean
        shell: bash
        run: git diff --exit-code

      - name: Check formatting
        shell: bash
        run: pnpm exec prettier --check packages/payload/src/utilities/createLocalReq.ts test/localization/local-api-request.int.spec.ts

      - name: Lint affected files
        shell: bash
        run: pnpm exec eslint --flag v10_config_lookup_from_file packages/payload/src/utilities/createLocalReq.ts test/localization/local-api-request.int.spec.ts

      - name: Run createLocalReq unit tests
        shell: bash
        run: pnpm exec vitest --run --project unit packages/payload/src/utilities/createLocalReq.spec.ts

      - name: Run focused localization regression on SQLite
        shell: bash
        env:
          PAYLOAD_DATABASE: sqlite
        run: pnpm exec vitest --run --project int test/localization/local-api-request.int.spec.ts

      - name: Start PostgreSQL
        shell: bash
        run: docker compose -f test/docker-compose.yml --profile postgres up -d --wait

      - name: Run focused localization regression on PostgreSQL
        shell: bash
        env:
          PAYLOAD_DATABASE: postgres
          POSTGRES_URL: postgresql://payload:payload@localhost:5433/payload
        run: pnpm exec vitest --run --project int test/localization/local-api-request.int.spec.ts

      - name: Confirm tests left exact candidate tree clean
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "536a00d73fb5f87b6c0d879b4b313c863bf9e221"
          git diff --exit-code

  build:
    if: github.repository == 'dijedontahiri/payload'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout immutable product candidate
        uses: actions/checkout@v6
        with:
          ref: 536a00d73fb5f87b6c0d879b4b313c863bf9e221
          fetch-depth: 4
          persist-credentials: false

      - name: Verify build source identity and scope
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "536a00d73fb5f87b6c0d879b4b313c863bf9e221"
          test "$(git rev-parse HEAD^^^)" = "f5d261d0925e95dbd0039803829dad6e736edcb1"
          git diff --exit-code
          mapfile -t files < <(git diff --name-only f5d261d0925e95dbd0039803829dad6e736edcb1..HEAD)
          test "${#files[@]}" -eq 2
          test "${files[0]}" = "packages/payload/src/utilities/createLocalReq.ts"
          test "${files[1]}" = "test/localization/local-api-request.int.spec.ts"

      - name: Setup repository toolchain
        uses: ./.github/actions/setup

      - name: Confirm pre-build tracked tree clean
        shell: bash
        run: git diff --exit-code

      - name: Build payload package
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm run build:payload

      - name: Inspect build side effects and protect product inputs
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "536a00d73fb5f87b6c0d879b4b313c863bf9e221"
          echo "Tracked changes produced by the build, if any:"
          git diff --name-status || true
          git diff --exit-code -- \
            packages/payload/src \
            test/localization/local-api-request.int.spec.ts \
            pnpm-lock.yaml \
            package.json \
            packages/payload/package.json
